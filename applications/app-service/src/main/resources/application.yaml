server:
  port: 8081
spring:
  application:
    name: "solicitudes-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
security:
  jwt:
    public: classpath:public.pem
    ttl-seconds: 3600
springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true   # <- evita Petstore
    url: /v1/api-docs                   # <- carga tu spec por defecto
    persist-authorization: true
  packages-to-scan: co.com.solicitudes.api
  paths-to-match: /api/**

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "solicitudes"
    schema: "public"
    username: "postgres"
    password: "1189"
  restconsumer:
    timeout: 5000
    url: "http://localhost:8080"
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
  logging:
    level:
      org.springframework.security: DEBUG
      org.springframework.security.web: DEBUG
      org.springframework.security.oauth2: DEBUG
      org.springframework.security.authentication: DEBUG
